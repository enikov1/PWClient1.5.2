[DataXor]
; These options apply only for developers: Debug build, or Release with file Configs\element_data_xor.dev present.
; Public client without .dev ignores this ini (always XOR + built-in default key).
; 1 = XOR-decrypt elementdata / task pack with key below
; 0 = plain files (no XOR)
enabled=0
; Key as ASCII (up to 256 bytes). If empty and enabled=1, TROUXA is used.
key=TROUXA
